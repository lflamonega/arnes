[project]
name = "arnes"
version = "0.1.0"
description = "Terminal tutor with source-grounded learning plans and independent evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt_toolkit>=3.0",
    "rich>=13.0",
]

[project.scripts]
arnes = "arnes.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
